<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điệp Vụ Toán 7 - Hệ Thống Bảo Mật</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #000;
            color: #0f0;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars from matrix background */
            -webkit-font-smoothing: antialiased;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4; /* Keep it subtle */
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .glass-panel {
            background: rgba(5, 10, 5, 0.85);
            border: 1px solid #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.15), inset 0 0 20px rgba(0, 255, 0, 0.05);
            backdrop-filter: blur(4px);
            width: 100%;
            max-w: 800px;
            border-radius: 4px;
        }

        .btn-hacker {
            position: relative;
            background: rgba(0, 20, 0, 0.5);
            color: #0f0;
            border: 1px solid #0f0;
            text-transform: uppercase;
            transition: all 0.2s ease;
            cursor: pointer;
            border-radius: 2px;
        }
        
        .btn-hacker:hover:not(:disabled) {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
            transform: translateY(-1px);
        }

        .btn-hacker:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-hacker.correct {
            background: #0f0 !important;
            color: #000 !important;
            border-color: #0f0 !important;
            box-shadow: 0 0 20px #0f0;
            animation: pulseCorrect 1s infinite;
        }

        .btn-hacker.wrong {
            background: rgba(255, 0, 0, 0.2) !important;
            color: #ff3333 !important;
            border-color: #ff3333 !important;
            box-shadow: 0 0 10px #ff3333;
        }

        @keyframes pulseCorrect {
            0% { box-shadow: 0 0 10px #0f0; }
            50% { box-shadow: 0 0 25px #0f0, inset 0 0 10px #0f0; }
            100% { box-shadow: 0 0 10px #0f0; }
        }

        .crt-text {
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .typewriter-cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #0f0;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
            box-shadow: 0 0 5px #0f0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .hidden-screen {
            display: none !important;
        }

        /* Glitch effect for title */
        .glitch {
            position: relative;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 83px, 0); }
            20% { clip: rect(61px, 9999px, 20px, 0); }
            40% { clip: rect(89px, 9999px, 51px, 0); }
            60% { clip: rect(32px, 9999px, 98px, 0); }
            80% { clip: rect(74px, 9999px, 12px, 0); }
            100% { clip: rect(4px, 9999px, 66px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(35px, 9999px, 91px, 0); }
            20% { clip: rect(12px, 9999px, 45px, 0); }
            40% { clip: rect(78px, 9999px, 14px, 0); }
            60% { clip: rect(54px, 9999px, 89px, 0); }
            80% { clip: rect(21px, 9999px, 67px, 0); }
            100% { clip: rect(93px, 9999px, 32px, 0); }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>
    
    <div class="main-container">
        <!-- Start Screen -->
        <div id="start-screen" class="glass-panel p-8 md:p-12 text-center flex flex-col items-center justify-center">
            <div class="mb-8">
                <svg class="w-24 h-24 mx-auto text-green-500 mb-6 drop-shadow-[0_0_10px_rgba(0,255,0,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path>
                </svg>
                <h1 class="text-4xl md:text-6xl font-bold mb-4 crt-text glitch" data-text="ĐIỆP VỤ TOÁN 7">ĐIỆP VỤ TOÁN 7</h1>
                <p class="text-green-600 uppercase tracking-[0.3em] text-sm md:text-lg border-b border-green-800 pb-4 inline-block">Cơ Sở Dữ Liệu Tối Mật</p>
            </div>
            <div class="h-12 flex items-center justify-center mb-8">
                <p id="boot-text" class="text-sm md:text-base opacity-90 text-green-400"></p>
            </div>
            <button id="start-btn" onclick="startMission()" class="btn-hacker px-10 py-4 font-bold text-lg md:text-xl w-full sm:w-auto tracking-widest hidden opacity-0 transition-opacity duration-500">
                > KÍCH HOẠT NHIỆM VỤ_
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="glass-panel p-6 md:p-10 hidden-screen flex flex-col w-full">
            <div class="flex justify-between items-end border-b border-green-800 pb-3 mb-6">
                <div>
                    <span class="text-xs text-green-600 block mb-1 tracking-widest">TIẾN ĐỘ CHIẾN DỊCH</span>
                    <span id="progress-text" class="text-sm md:text-base font-bold tracking-widest text-white">MỤC TIÊU: 1/10</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-green-600 block mb-1 tracking-widest">TRẠNG THÁI</span>
                    <span class="text-xs md:text-sm text-green-400 font-bold animate-pulse">ĐANG KẾT NỐI...</span>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-black/50 h-3 mb-8 rounded-sm overflow-hidden border border-green-900">
                <div id="progress-bar" class="bg-green-500 h-full transition-all duration-700 ease-out shadow-[0_0_10px_#0f0]" style="width: 0%"></div>
            </div>

            <div class="min-h-[120px] mb-8 bg-black/30 p-4 border-l-4 border-green-500">
                <p class="text-green-700 text-xs mb-2 tracking-widest uppercase">> Phân tích dữ liệu câu hỏi...</p>
                <p id="question-text" class="text-lg md:text-2xl leading-relaxed text-white">
                    <!-- Text typed here dynamically -->
                </p>
            </div>

            <div id="options-container" class="flex-grow flex flex-col justify-end space-y-4">
                <!-- Options injected here -->
            </div>
            
            <div id="feedback-container" class="min-h-[2rem] mt-6 text-center font-bold text-sm md:text-base tracking-widest opacity-0 transition-opacity duration-300">
                <!-- Feedback text injected here -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="glass-panel p-8 md:p-12 text-center hidden-screen flex flex-col items-center justify-center">
            <svg class="w-20 h-20 mx-auto text-green-500 mb-4 drop-shadow-[0_0_10px_rgba(0,255,0,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h2 class="text-3xl md:text-5xl font-bold mb-2 crt-text tracking-widest">BÁO CÁO CHIẾN DỊCH</h2>
            <div class="my-8 border-t border-b border-green-800 py-8 w-full bg-black/20">
                <p class="text-sm md:text-base mb-3 text-green-600 uppercase tracking-widest">Mức độ tương thích dữ liệu:</p>
                <p id="score-text" class="text-7xl font-bold crt-text text-white drop-shadow-[0_0_15px_#0f0]">0 / 10</p>
            </div>
            <div class="min-h-[60px] mb-8">
                <p id="evaluation-text" class="font-bold tracking-widest text-lg md:text-xl uppercase"></p>
            </div>
            <button onclick="restartMission()" class="btn-hacker px-8 py-4 font-bold text-lg w-full sm:w-auto tracking-widest">
                > TIẾN HÀNH RÀ SOÁT LẠI_
            </button>
        </div>
    </div>

    <script>
        // Matrix Background Animation
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZΣπ∞√∫∆';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                // Add occasional brightness for hacker effect
                if(Math.random() > 0.98) {
                    ctx.fillStyle = '#fff';
                } else {
                    ctx.fillStyle = '#0F0';
                }
                
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Quiz Data extracted from JSON
        const quizData = [
            {
                question: "Dựa trên hồ sơ chỉ huy trưởng, bí danh của người dẫn dắt chiến dịch Toán 7 là gì?",
                options: ["Cô Bông", "Điệp viên 007", "Chỉ huy X", "Thầy John"],
                correctAnswer: "Cô Bông"
            },
            {
                question: "Kỹ năng nào thuộc 'Bán cầu Phải' giúp đặc vụ duy trì sự kiên trì trước các dự án khó?",
                options: ["Độ bền Giáp trụ", "Tốc độ Tính toán", "Khả năng Ghi nhớ", "Suy luận Logic"],
                correctAnswer: "Độ bền Giáp trụ"
            },
            {
                question: "Dựa trên các bảng manh mối Alpha, Beta và Gamma, chương trình Toán 7 có tổng cộng mấy chương?",
                options: ["10 chương", "8 chương", "12 chương", "5 chương"],
                correctAnswer: "10 chương"
            },
            {
                question: "Hành động nào sau đây là yêu cầu bắt buộc thuộc 'Vùng 1: Kỷ luật Bản thân'?",
                options: ["Tập trung nhiệm vụ", "Thức khuya chơi game", "Đi học muộn 5 phút", "Quên mang vũ khí (Sách vở)"],
                correctAnswer: "Tập trung nhiệm vụ"
            },
            {
                question: "Theo lịch trình càn quét học kỳ 1, 'Trận đánh' Kiểm tra Giữa kỳ I diễn ra vào tuần thứ mấy?",
                options: ["Tuần 14", "Tuần 10", "Tuần 8", "Tuần 16"],
                correctAnswer: "Tuần 14"
            },
            {
                question: "Thiết bị nào sau đây tuyệt đối KHÔNG được phép sử dụng trong quá trình tác chiến trực tiếp?",
                options: ["Điện thoại thông minh", "Máy tính bỏ túi", "Thước kẻ", "Compa"],
                correctAnswer: "Điện thoại thông minh"
            },
            {
                question: "Hành vi nào bị coi là vi phạm 'Đạo đức nghề nghiệp' trong thỏa thuận tác chiến?",
                options: ["Tuyệt đối dùng AI", "Hợp tác với đồng đội", "Nộp báo cáo đúng hạn", "Chủ động đặt câu hỏi"],
                correctAnswer: "Tuyệt đối dùng AI"
            },
            {
                question: "Nhiệm vụ 'Huấn luyện độc lập' yêu cầu người giám hộ thực hiện hành động nào?",
                options: ["Làm gương trung thực", "Làm bài tập hộ", "Giám sát 24/24", "Cung cấp đáp án"],
                correctAnswer: "Làm gương trung thực"
            },
            {
                question: "Chương 10 trong phân khu Beta (Bản đồ không gian) có mật danh là gì?",
                options: ["Xây dựng căn cứ", "Khám phá không gian", "Hình học trực quan", "Đo lường thực tế"],
                correctAnswer: "Xây dựng căn cứ"
            },
            {
                question: "Theo nội quy lớp học (Vùng 3: Bảo vệ Căn cứ), đặc vụ cần tuân thủ điều gì để duy trì môi trường tác chiến lý tưởng?",
                options: ["Tuân thủ hướng dẫn & Giữ trật tự", "Tự do đi lại trong lớp", "Ăn uống tại vị trí tác chiến", "Làm nhiệm vụ của môn khác"],
                correctAnswer: "Tuân thủ hướng dẫn & Giữ trật tự"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let isAnimating = false;
        let typingTimeout;

        let synth;
        let errorSynth;

        async function initAudio() {
            if (!synth) {
                // Khởi tạo AudioContext sau khi người dùng tương tác (click nút start)
                await Tone.start();
                
                // Tạo bộ tổng hợp âm thanh cho đáp án ĐÚNG (Tiếng bíp cao, trong trẻo)
                synth = new Tone.Synth({
                    oscillator: { type: 'square' },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.1, release: 0.5 }
                }).toDestination();
                synth.volume.value = -10; // Giảm âm lượng một chút
                
                // Tạo bộ tổng hợp âm thanh cho đáp án SAI (Tiếng trầm, rè cảnh báo)
                errorSynth = new Tone.Synth({
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.5 }
                }).toDestination();
                errorSynth.volume.value = -8;
            }
        }

        function playCorrectSound() {
            if (synth) {
                const now = Tone.now();
                // Đánh 2 nốt bíp liên tục
                synth.triggerAttackRelease("E5", "0.1", now);
                synth.triggerAttackRelease("C6", "0.2", now + 0.15);
            }
        }

        function playWrongSound() {
            if (errorSynth) {
                const now = Tone.now();
                // Đánh nốt trầm, kéo dài hơn
                errorSynth.triggerAttackRelease("D3", "0.15", now);
                errorSynth.triggerAttackRelease("G2", "0.35", now + 0.15);
            }
        }

        // Boot sequence on load
        window.onload = () => {
            const bootText = "Đang thiết lập kết nối an toàn... Xác thực thành công. Nhấn để tiếp tục.";
            const bootEl = document.getElementById('boot-text');
            typeWriterRaw(bootText, bootEl, 0, () => {
                const btn = document.getElementById('start-btn');
                btn.classList.remove('hidden');
                setTimeout(() => {
                    btn.classList.remove('opacity-0');
                }, 100);
            });
        };

        function startMission() {
            initAudio(); // Yêu cầu cấp quyền phát âm thanh khi người chơi bấm nút
            document.getElementById('start-screen').classList.add('hidden-screen');
            document.getElementById('quiz-screen').classList.remove('hidden-screen');
            loadQuestion();
        }

        function loadQuestion() {
            isAnimating = false;
            const q = quizData[currentQuestion];
            
            // Update progress
            document.getElementById('progress-text').innerText = `MỤC TIÊU: ${currentQuestion + 1}/${quizData.length}`;
            const progressPercent = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Clear previous options and feedback
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const feedbackContainer = document.getElementById('feedback-container');
            feedbackContainer.innerHTML = '';
            feedbackContainer.classList.add('opacity-0');
            
            // Typewriter effect for question
            const qEl = document.getElementById('question-text');
            clearTimeout(typingTimeout);
            qEl.innerHTML = '';
            
            typeWriter(q.question, qEl, 0, () => {
                renderOptions(q);
            });
        }

        function typeWriterRaw(text, element, i, callback) {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriterRaw(text, element, i + 1, callback), 30);
            } else {
                if (callback) callback();
            }
        }

        function typeWriter(text, element, i, callback) {
            if (i === 0) {
                element.innerHTML = '<span id="typed-content"></span><span class="typewriter-cursor"></span>';
            }
            const content = document.getElementById('typed-content');
            
            if (i < text.length) {
                content.innerHTML += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriter(text, element, i + 1, callback), 15); // Fast typing
            } else {
                if (callback) callback();
            }
        }

        function renderOptions(q) {
            const container = document.getElementById('options-container');
            container.innerHTML = ''; // Ensure clear
            
            // Shuffle options
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-hacker w-full text-left p-4 md:p-5 font-bold text-sm md:text-base opacity-0 transform translate-y-4 transition-all duration-300';
                btn.innerHTML = `<span class="text-green-700 mr-2">[${String.fromCharCode(65 + index)}]</span> <span class="text-white">${opt}</span>`;
                btn.dataset.opt = opt; // Gắn data attribute để so sánh chính xác đáp án
                btn.onclick = () => handleAnswer(btn, opt, q.correctAnswer);
                container.appendChild(btn);
                
                // Staggered fade in
                setTimeout(() => {
                    btn.classList.remove('opacity-0', 'translate-y-4');
                }, index * 150);
            });
        }

        function handleAnswer(btn, selected, correct) {
            if (isAnimating) return;
            isAnimating = true;
            
            const allBtns = document.querySelectorAll('#options-container button');
            const feedbackContainer = document.getElementById('feedback-container');
            allBtns.forEach(b => b.disabled = true);

            let delay = 1800; // Thời gian chờ mặc định khi trả lời đúng

            if (selected === correct) {
                playCorrectSound();
                btn.classList.add('correct');
                btn.innerHTML += ' <span class="float-right text-black animate-pulse">[ ĐÃ XÁC THỰC ]</span>';
                
                feedbackContainer.innerHTML = '<span class="text-green-400 drop-shadow-[0_0_5px_#0f0]">> TRUY CẬP DỮ LIỆU THÀNH CÔNG</span>';
                feedbackContainer.classList.remove('opacity-0');
                score++;
            } else {
                playWrongSound();
                btn.classList.add('wrong');
                btn.innerHTML += ' <span class="float-right text-red-500">[ TỪ CHỐI ]</span>';
                
                // Highlight correct answer một cách chính xác dựa trên data-opt
                allBtns.forEach(b => {
                    if (b.dataset.opt === correct) {
                        b.classList.add('correct');
                        b.innerHTML += ' <span class="float-right text-black animate-pulse">[ ĐÁP ÁN CHUẨN ]</span>';
                    }
                });
                
                // Hiển thị thông báo đáp án đúng rõ ràng bên dưới
                feedbackContainer.innerHTML = `<span class="text-red-400 drop-shadow-[0_0_5px_#f00]">> LỖI! ĐÁP ÁN CHUẨN LÀ: ${correct.toUpperCase()}</span>`;
                feedbackContainer.classList.remove('opacity-0');
                
                delay = 3500; // Tăng thời gian chờ lên 3.5s để người chơi kịp đối chiếu
            }

            // Move to next question after delay
            setTimeout(() => {
                feedbackContainer.classList.add('opacity-0');
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, delay);
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden-screen');
            document.getElementById('result-screen').classList.remove('hidden-screen');
            
            // Final progress bar fill
            document.getElementById('progress-bar').style.width = `100%`;
            
            document.getElementById('score-text').innerText = `${score} / ${quizData.length}`;
            
            const evalEl = document.getElementById('evaluation-text');
            evalEl.innerHTML = ''; // clear for typing
            
            let evalText = "";
            let colorClass = "";
            
            if (score === quizData.length) {
                evalText = "ĐÁNH GIÁ: ĐẶC VỤ XUẤT SẮC. CẤP QUYỀN TRUY CẬP TỐI ĐA VÀO HỆ THỐNG.";
                colorClass = "text-green-400";
            } else if (score >= 7) {
                evalText = "ĐÁNH GIÁ: ĐẠT YÊU CẦU CHIẾN DỊCH. SẴN SÀNG NHẬN NHIỆM VỤ.";
                colorClass = "text-green-400";
            } else {
                evalText = "ĐÁNH GIÁ: THIẾU KỸ NĂNG CƠ BẢN. YÊU CẦU HUẤN LUYỆN LẠI NGAY LẬP TỨC.";
                colorClass = "text-red-500";
            }
            
            evalEl.className = `font-bold tracking-widest text-lg md:text-xl uppercase ${colorClass}`;
            typeWriterRaw(evalText, evalEl, 0);
        }

        function restartMission() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('result-screen').classList.add('hidden-screen');
            startMission();
        }
    </script>
</body>
</html>
